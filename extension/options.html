<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DarkShield Settings</title>
    <link rel="stylesheet" href="styles/popup.css" />
  </head>
  <body style="width: 520px; min-height: 360px">
    <header>
      <img src="icons/icon.png" alt="DarkShield" />
      <div>
        <div class="title">DarkShield Settings</div>
        <div class="sub">Local-only configuration</div>
      </div>
    </header>
    <main>
      <div class="card">
        <div style="font-weight: 700; margin-bottom: 8px">API base URL</div>
        <input
          id="ds-api-base"
          style="
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.04);
            color: #e6edf3;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
          "
        />
        <div class="label" style="margin-top: 8px">Default: http://127.0.0.1:5000 (Flask API)</div>
      </div>
      <div class="card" style="margin-top: 12px">
        <div style="font-weight: 700; margin-bottom: 8px">Inference mode</div>
        <select
          id="ds-inference-mode"
          style="
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.06);
            color: #e6edf3;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
          "
        >
          <option value="local">Local (ONNX in browser — default)</option>
          <option value="api">API (Flask server)</option>
        </select>
        <div class="label" style="margin-top: 8px">Local mode keeps snippets on-device; API mode sends text to your configured base URL.</div>
      </div>
      <div class="card" style="margin-top: 12px">
        <label style="display: flex; gap: 10px; align-items: flex-start; font-size: 14px; cursor: pointer">
          <input type="checkbox" id="ds-page-toast" style="margin-top: 4px" />
          <span>Show on-page summary when patterns are detected (bottom-right card)</span>
        </label>
      </div>
      <button class="primary" id="ds-save" type="button">Save</button>
      <div class="label" id="ds-status" style="margin-top: 10px"></div>
    </main>
    <script src="options.js"></script>
  </body>
</html>
